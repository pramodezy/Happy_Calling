<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Motorola Happy Calling - CCI Service Portal</title>
    <meta
      name="description"
      content="Motorola Happy Calling CCI Service Portal - Live post-service customer satisfaction tracking, pending closure workflows, and enterprise performance analytics."
    />
    <meta name="theme-color" content="#001435" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./src/css/app.css" />
    <link rel="stylesheet" href="./src/css/responsive.css" />

    <!-- Import Map for Direct Browser & GitHub Pages Resolution -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.49.1",
          "chart.js": "https://esm.sh/chart.js@4.4.8",
          "chart.js/auto": "https://esm.sh/chart.js@4.4.8/auto",
          "xlsx": "https://esm.sh/xlsx@0.18.5"
        }
      }
    </script>
  </head>
  <body>
    <!-- Main Application Container -->
    <div id="app">
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#001435; color:#ffffff; font-family:system-ui,-apple-system,sans-serif; text-align:center; padding:1.5rem;">
        <div style="width:52px; height:52px; background:#0072ce; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.5rem; margin-bottom:1rem;">M</div>
        <h2 style="font-size:1.35rem; font-weight:700; margin-bottom:0.25rem;">Motorola Happy Calling</h2>
        <p style="font-size:0.875rem; color:rgba(255,255,255,0.7); margin-bottom:1.5rem;">CCI Service Portal</p>
        <div style="width:32px; height:32px; border:3px solid rgba(255,255,255,0.2); border-top-color:#0072ce; border-radius:50%; animation:app-spin 0.8s linear infinite;"></div>
        <style>@keyframes app-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>

    <!-- Global Toast Notification Layer -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Dynamic Modal Overlay Layer -->
    <div id="modal-container"></div>

    <!-- Application Script Entrypoint -->
    <script type="module" src="./src/js/main.js?v=2.11"></script>
  </body>
</html>
